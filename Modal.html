<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column shell. Lessons are cards coloured like ringgit notes; each lesson page stacks idea, calculator, key points, quiz. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#F1F5F7; --surface:#FFFFFF; --ink:#102230; --muted:#546878; --line:#D6DFE5;
  --accent:#0E6B5B; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --good:#1B7A45; --good-soft:#DFF1E6; --bad:#B3261E; --bad-soft:#F9E3E1;
  --chip-ink:#FFFFFF;
  --n1:#2F6DB5; --n5:#2E8B57; --n10:#C4413B; --n20:#C2761C; --n50:#237F8B; --n100:#7A4FA0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D161D; --surface:#15222B; --ink:#E5ECF1; --muted:#92A3B1; --line:#263642;
    --accent:#4CC3A8; --accent-ink:#05241D; --accent-soft:#123A33;
    --good:#5BD08A; --good-soft:#143626; --bad:#F08A82; --bad-soft:#3E1E1C;
    --chip-ink:#0D161D;
    --n1:#5B9BE0; --n5:#52B87E; --n10:#E8716A; --n20:#E8A24E; --n50:#4FBAC7; --n100:#A682CC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161D; --surface:#15222B; --ink:#E5ECF1; --muted:#92A3B1; --line:#263642;
  --accent:#4CC3A8; --accent-ink:#05241D; --accent-soft:#123A33;
  --good:#5BD08A; --good-soft:#143626; --bad:#F08A82; --bad-soft:#3E1E1C;
  --chip-ink:#0D161D;
  --n1:#5B9BE0; --n5:#52B87E; --n10:#E8716A; --n20:#E8A24E; --n50:#4FBAC7; --n100:#A682CC;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;margin:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.shell{max-width:960px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-.03em;color:var(--ink);text-decoration:none;line-height:1}
.brand small{font-family:var(--font-body);font-weight:500;font-size:.8rem;letter-spacing:0;color:var(--muted);margin-left:8px}
.top nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
.top nav a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem}
.top nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.prog-pill{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);white-space:nowrap}
main{padding-block:28px 24px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 1em}
.lede{font-size:1.1rem;color:var(--muted);max-width:56ch;margin-top:14px}
.eyebrow{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* home */
.hero{padding-block:8px 24px}
.meter{display:flex;align-items:center;gap:12px;margin-top:22px;max-width:420px}
.meter-bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meter span{font-family:var(--font-mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card h3{margin-bottom:4px}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.card .meta{display:flex;gap:10px;align-items:center;margin-top:10px;font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.tag-done{color:var(--good);font-weight:600}
.note{width:68px;height:40px;border-radius:5px;background-color:var(--c);color:var(--chip-ink);font-family:var(--font-mono);font-weight:600;font-size:.85rem;display:grid;place-items:center;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 2px,transparent 2px 7px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.note.big{width:84px;height:48px;font-size:1rem}
.foot-note{margin-top:28px;color:var(--muted);font-size:.9rem;max-width:62ch}

/* lesson */
.back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:600;font-size:.95rem}
.l-head{display:flex;gap:18px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.l-head .sub{color:var(--muted);font-family:var(--font-mono);font-size:.8rem;margin-top:6px}
.lesson{max-width:760px}
.sec{margin-top:36px}
.sec>.eyebrow{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px 28px}
.field{display:block;min-width:0}
.f-top{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted);margin-bottom:4px}
output{font-family:var(--font-mono);color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-top:20px}
.stat{padding:12px 14px;border-radius:10px;background:var(--bg);min-width:0}
.stat .v{font-family:var(--font-mono);font-size:1.2rem;font-weight:600;overflow-wrap:anywhere}
.stat .l{font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:2px}
.stat.hl{background:var(--accent-soft)}
.stat.hl .v{color:var(--accent)}
.say{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:.95rem}
.say.warn{background:var(--bad-soft)}
.fine{font-size:.82rem;color:var(--muted);margin:14px 0 0}
.bars{display:grid;gap:10px;margin-top:20px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.85rem}
.bar-row .t{height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-row .t i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar-row .t i.alt{background:var(--n10)}
.bar-row b{font-family:var(--font-mono);font-weight:600}
.points{margin:0;padding-left:1.2em}
.points li{margin-bottom:.5em}
svg.chart{width:100%;height:auto;display:block;margin-top:18px}
.ax{fill:var(--muted);font:11px var(--font-mono)}
.grid-l{stroke:var(--line);stroke-width:1}
.l-bal{stroke:var(--accent);stroke-width:2.5;fill:none}
.a-bal{fill:var(--accent);opacity:.16}
.l-con{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.l-vol{stroke:var(--accent);stroke-width:2.5;fill:none}
.l-floor{stroke:var(--n10);stroke-width:1.5;stroke-dasharray:5 4}
.dot{fill:var(--accent)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2px dashed var(--ink)}
.legend i.r{border-top:2px dashed var(--n10)}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-weight:600;font-size:.9rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dl{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:10px 18px;margin:0}
.dl dt{color:var(--muted);font-size:.85rem;padding-top:2px}
.dl dd{margin:0}
.gauge{display:inline-flex;gap:4px;vertical-align:middle;margin-right:8px}
.gauge i{width:16px;height:8px;border-radius:2px;background:var(--line)}
.gauge i.on{background:var(--accent)}
.gauge.risk i.on{background:var(--n20)}

/* checklist + table */
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-of-type{border-bottom:0}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.check span b{display:block}
.check span small{color:var(--muted);font-size:.88rem}
.tbl-wrap{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.8rem}
td{font-family:var(--font-mono)}
.sub-h{margin:26px 0 10px}
.flags{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.flags li{padding:10px 12px;border-radius:8px;background:var(--bad-soft);font-size:.93rem}

/* quiz */
.q-head{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);margin-bottom:8px}
.q-text{margin-bottom:14px;font-size:1.2rem}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.q-fb{margin-top:14px;min-height:1.4em;font-size:.95rem}
.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.score{font-family:var(--font-display);font-size:2.4rem;font-weight:800}

/* glossary */
.search{font:inherit;width:100%;max-width:420px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:18px 0 8px}
.gl{margin:0;display:grid;gap:0}
.gl div{padding:14px 0;border-bottom:1px solid var(--line)}
.gl dt{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.gl dd{margin:4px 0 0;color:var(--muted);max-width:68ch}
@media (max-width:520px){
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dd{margin-bottom:10px}
  .bar-row{grid-template-columns:minmax(0,1fr) auto}
  .bar-row .t{grid-column:1 / -1;order:3}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#home">Modal<small>Investing basics</small></a>
    <nav aria-label="Main">
      <a href="#home" data-nav="home">Lessons</a>
      <a href="#glossary" data-nav="glossary">Glossary</a>
      <span class="prog-pill" id="pill">0 of 6 done</span>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var fmt=function(n){return 'RM '+Math.round(n).toLocaleString('en-MY')};
var fmtK=function(v){return v>=1e6?(v/1e6).toFixed(1)+'m':v>=1000?Math.round(v/1000)+'k':String(Math.round(v))};

/* ---------- progress store ---------- */
var store={done:{},checks:{}};
try{var raw=localStorage.getItem('modal-progress');if(raw){var p=JSON.parse(raw);store.done=p.done||{};store.checks=p.checks||{};}}catch(e){}
function save(){try{localStorage.setItem('modal-progress',JSON.stringify(store));}catch(e){}}

/* ---------- helpers ---------- */
function field(key,label,min,max,step,val,f){
  return '<label class="field"><span class="f-top"><span>'+label+'</span><output data-out="'+key+'">'+f(val)+'</output></span>'+
  '<input type="range" data-key="'+key+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></label>';
}
function wire(root,fmts,cb){
  function get(){var v={};root.querySelectorAll('input[data-key]').forEach(function(i){v[i.dataset.key]=+i.value;});return v;}
  root.addEventListener('input',function(e){
    var i=e.target.closest('input[data-key]');if(!i)return;
    root.querySelector('[data-out="'+i.dataset.key+'"]').textContent=fmts[i.dataset.key](+i.value);
    cb(get());
  });
  cb(get());
}
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x)));var f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function stat(v,l,hl){return '<div class="stat'+(hl?' hl':'')+'"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';}

/* ---------- widgets ---------- */
var W={};

W.inflation=function(root){
  var f={amt:fmt,sav:function(v){return v.toFixed(1)+'%'},infl:function(v){return v.toFixed(1)+'%'},yrs:function(v){return v+' years'}};
  root.innerHTML='<div class="controls">'+
    field('amt','Savings today',1000,100000,1000,10000,f.amt)+
    field('sav','Your savings earn per year',0,8,0.5,2.5,f.sav)+
    field('infl','Inflation per year',0,8,0.5,3,f.infl)+
    field('yrs','Time',1,40,1,20,f.yrs)+
  '</div><div id="out"></div>';
  wire(root,f,function(v){
    var nominal=v.amt*Math.pow(1+v.sav/100,v.yrs);
    var real=nominal/Math.pow(1+v.infl/100,v.yrs);
    var price=v.amt*Math.pow(1+v.infl/100,v.yrs);
    var max=Math.max(nominal,v.amt,real);
    var msg=real<v.amt-1
      ? 'After '+v.yrs+' years your balance looks bigger, but it buys about '+fmt(v.amt-real)+' less than the money you started with.'
      : 'Here your money grows faster than prices, so its buying power rises by about '+fmt(real-v.amt)+'.';
    $('#out',root).innerHTML=
      '<div class="bars">'+
        '<div class="bar-row"><span>Balance in the bank</span><span class="t"><i style="width:'+(nominal/max*100)+'%"></i></span><b>'+fmt(nominal)+'</b></div>'+
        '<div class="bar-row"><span>Buying power, in today\'s RM</span><span class="t"><i class="alt" style="width:'+(real/max*100)+'%"></i></span><b>'+fmt(real)+'</b></div>'+
      '</div>'+
      '<div class="stats">'+
        stat(fmt(price),'What costs '+fmt(v.amt)+' today would cost then',false)+
        stat(((real/v.amt-1)*100).toFixed(1)+'%','Change in buying power',true)+
      '</div>'+
      '<p class="say'+(real<v.amt-1?' warn':'')+'">'+msg+'</p>'+
      '<p class="fine">Illustrative rates you can change. Real savings rates and inflation vary from year to year.</p>';
  });
};

var ASSETS=[
 {k:'Cash and fixed deposits',risk:1,liq:5,what:'Money in a savings account or a fixed deposit at a bank.',earn:'Interest at a rate the bank sets.',danger:'Returns may not keep up with inflation. Deposits in Malaysian banks are protected by PIDM up to RM250,000 per depositor per bank.',horizon:'Under 1 year',eg:'Bank savings account, fixed deposit'},
 {k:'Bonds and sukuk',risk:2,liq:3,what:'A loan you give to a government or company. Sukuk are the Shariah-compliant version.',earn:'Regular profit payments, then your money back at maturity.',danger:'The issuer could fail to pay, and prices fall when interest rates rise.',horizon:'1 to 10 years',eg:'Malaysian Government Securities (MGS), Government Investment Issues (GII)'},
 {k:'Stocks',risk:4,liq:4,what:'Small ownership stakes in listed companies.',earn:'Price gains and dividends.',danger:'Prices can fall sharply, and a single company can fail.',horizon:'5+ years',eg:'Shares listed on Bursa Malaysia'},
 {k:'Unit trusts and ETFs',risk:3,liq:4,what:'Pooled funds that hold many investments. ETFs trade on the exchange like shares.',earn:'Growth in the fund price plus distributions.',danger:'Fees reduce returns, and a fund is only as safe as what it holds.',horizon:'3 to 10+ years',eg:'ASNB funds (some are limited to Bumiputera), ETFs listed on Bursa Malaysia'},
 {k:'REITs',risk:3,liq:4,what:'Funds that own income-producing property such as malls and offices, listed on Bursa.',earn:'Rental income paid out as distributions, plus price changes.',danger:'Property values, occupancy and interest rates all move the price.',horizon:'5+ years',eg:'Property trusts listed on Bursa Malaysia'},
 {k:'Gold and property',risk:3,liq:2,what:'Physical assets. Gold is held as a store of value. Property can bring rent and growth.',earn:'Price gains, plus rent for property.',danger:'Gold pays no income. Property is costly to buy and sell and hard to split up.',horizon:'5+ years',eg:'Gold bars or gold accounts, residential property'}
];
function gauge(n,cls){var s='<span class="gauge '+cls+'" aria-hidden="true">';for(var i=1;i<=5;i++)s+='<i class="'+(i<=n?'on':'')+'"></i>';return s+'</span>';}
W.assets=function(root){
  var cur=0;
  function draw(){
    var a=ASSETS[cur];
    root.innerHTML='<div class="tabs" role="group" aria-label="Asset types">'+ASSETS.map(function(x,i){return '<button class="tab" data-i="'+i+'" aria-pressed="'+(i===cur)+'">'+x.k+'</button>';}).join('')+'</div>'+
    '<dl class="dl">'+
      '<dt>What it is</dt><dd>'+a.what+'</dd>'+
      '<dt>How you earn</dt><dd>'+a.earn+'</dd>'+
      '<dt>Main risk</dt><dd>'+a.danger+'</dd>'+
      '<dt>Risk level</dt><dd>'+gauge(a.risk,'risk')+a.risk+' of 5</dd>'+
      '<dt>Easy to sell</dt><dd>'+gauge(a.liq,'')+a.liq+' of 5</dd>'+
      '<dt>Usual time frame</dt><dd>'+a.horizon+'</dd>'+
      '<dt>Examples</dt><dd>'+a.eg+'</dd>'+
    '</dl><p class="fine">Ratings are a rough guide for comparison. Examples are not recommendations.</p>';
    root.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){cur=+b.dataset.i;draw();var t=root.querySelector('.tab[aria-pressed="true"]');if(t)t.focus();});});
  }
  draw();
};

function sim(init,mo,rate,years){
  var b=init,c=init,bal=[b],con=[c],r=rate/100/12;
  for(var y=1;y<=years;y++){for(var m=0;m<12;m++){b=b*(1+r)+mo;c+=mo;}bal.push(b);con.push(c);}
  return {bal:bal,con:con};
}
W.compound=function(root){
  var f={init:fmt,mo:fmt,rate:function(v){return v.toFixed(1)+'%'},yrs:function(v){return v+' years'}};
  root.innerHTML='<div class="controls">'+
    field('init','Starting amount',0,50000,500,1000,f.init)+
    field('mo','Add each month',0,3000,50,500,f.mo)+
    field('rate','Return per year',0,12,0.5,6,f.rate)+
    field('yrs','Time',1,40,1,20,f.yrs)+
  '</div><div id="out"></div>';
  wire(root,f,function(v){
    var s=sim(v.init,v.mo,v.rate,v.yrs);
    var fin=s.bal[v.yrs],put=s.con[v.yrs],gain=fin-put;
    var W_=640,H=260,L=52,R=14,T=12,B=28,pw=W_-L-R,ph=H-T-B;
    var step=niceStep(Math.max(fin,1)/4),top=step*4;
    var X=function(y){return L+y/v.yrs*pw},Y=function(val){return T+ph-val/top*ph};
    var svg='<svg class="chart" viewBox="0 0 '+W_+' '+H+'" role="img" aria-label="Chart of balance and money put in over '+v.yrs+' years">';
    for(var g=0;g<=4;g++){var yy=Y(step*g);svg+='<line class="grid-l" x1="'+L+'" x2="'+(W_-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="ax" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+fmtK(step*g)+'</text>';}
    var iv=v.yrs<=12?2:v.yrs<=25?5:10;
    for(var t=0;t<=v.yrs;t+=iv){svg+='<text class="ax" x="'+X(t)+'" y="'+(H-8)+'" text-anchor="middle">'+t+'</text>';}
    var pb=s.bal.map(function(b,i){return X(i).toFixed(1)+','+Y(b).toFixed(1)}).join(' ');
    var pc=s.con.map(function(b,i){return X(i).toFixed(1)+','+Y(b).toFixed(1)}).join(' ');
    svg+='<polygon class="a-bal" points="'+X(0)+','+Y(0)+' '+pb+' '+X(v.yrs)+','+Y(0)+'"/>';
    svg+='<polyline class="l-con" points="'+pc+'"/><polyline class="l-bal" points="'+pb+'"/>';
    svg+='<circle class="dot" cx="'+X(v.yrs)+'" cy="'+Y(fin)+'" r="4.5"/></svg>';
    var delayMsg='';
    if(v.yrs>10){
      var late=sim(v.init,v.mo,v.rate,v.yrs-10).bal[v.yrs-10];
      delayMsg='If you waited 10 years before starting this same plan, you would end with '+fmt(late)+', which is '+fmt(fin-late)+' less.';
    } else {delayMsg='Move the time slider past 10 years to see what waiting costs.';}
    var dbl=v.rate>0?(72/v.rate).toFixed(1)+' years':'never';
    $('#out',root).innerHTML=
      '<div class="stats">'+stat(fmt(fin),'Value after '+v.yrs+' years',true)+stat(fmt(put),'Money you put in',false)+stat(fmt(gain),'Growth earned',false)+stat(dbl,'Rule of 72: time to double',false)+'</div>'+
      svg+
      '<div class="legend"><span><i></i>Balance</span><span><i class="d"></i>Money you put in</span></div>'+
      '<p class="say">'+delayMsg+'</p>'+
      '<p class="fine">Assumes a steady return compounded monthly. Real returns change every year and are never guaranteed. Fees and tax are not included.</p>';
  });
};

W.diversify=function(root){
  var SIG=30,RHO=0.35;
  var vol=function(n){return SIG*Math.sqrt(1/n+(1-1/n)*RHO)};
  var floor=SIG*Math.sqrt(RHO);
  var f={n:function(v){return v+(v===1?' stock':' stocks')}};
  root.innerHTML='<div class="controls">'+field('n','Stocks you hold, equal amounts',1,30,1,1,f.n)+'</div><div id="out"></div>';
  wire(root,f,function(v){
    var cv=vol(v.n);
    var W_=640,H=220,L=44,R=14,T=12,B=30,pw=W_-L-R,ph=H-T-B,top=35;
    var X=function(n){return L+(n-1)/29*pw},Y=function(val){return T+ph-val/top*ph};
    var svg='<svg class="chart" viewBox="0 0 '+W_+' '+H+'" role="img" aria-label="Risk falls as the number of stocks rises, then levels off">';
    [0,10,20,30].forEach(function(g){svg+='<line class="grid-l" x1="'+L+'" x2="'+(W_-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'"/><text class="ax" x="'+(L-8)+'" y="'+(Y(g)+4)+'" text-anchor="end">'+g+'%</text>';});
    [1,5,10,15,20,25,30].forEach(function(n){svg+='<text class="ax" x="'+X(n)+'" y="'+(H-8)+'" text-anchor="middle">'+n+'</text>';});
    var pts=[];for(var n=1;n<=30;n++)pts.push(X(n).toFixed(1)+','+Y(vol(n)).toFixed(1));
    svg+='<line class="l-floor" x1="'+L+'" x2="'+(W_-R)+'" y1="'+Y(floor)+'" y2="'+Y(floor)+'"/>';
    svg+='<polyline class="l-vol" points="'+pts.join(' ')+'"/><circle class="dot" cx="'+X(v.n)+'" cy="'+Y(cv)+'" r="5"/></svg>';
    $('#out',root).innerHTML=
      '<div class="stats">'+stat(cv.toFixed(1)+'%','Yearly ups and downs of your portfolio',true)+stat(floor.toFixed(1)+'%','Level that stays however many you add',false)+stat(Math.round((1-cv/SIG)*100)+'%','Reduction versus holding one stock',false)+'</div>'+
      svg+
      '<div class="legend"><span><i></i>Portfolio risk</span><span><i class="r"></i>Market risk that remains</span></div>'+
      '<p class="say">In a typical year, about two years in three, returns land within roughly '+cv.toFixed(0)+' percentage points either side of the average. Most of the gain comes from the first 10 or so stocks.</p>'+
      '<p class="fine">Simplified model: each stock moves about 30% a year and any two stocks are moderately linked. Real figures differ by market and period. The chart shows yearly risk as a percentage on the left and the number of stocks along the bottom.</p>';
  });
};

W.dca=function(root){
  var cur='dip';
  function draw(){
    var p=SCEN[cur].p,amt=600,units=0,rows='';
    p.forEach(function(px,i){var u=amt/px;units+=u;rows+='<tr><td>Month '+(i+1)+'</td><td>'+px.toFixed(2)+'</td><td>'+u.toFixed(1)+'</td><td>'+units.toFixed(1)+'</td></tr>';});
    var invested=amt*p.length,last=p[p.length-1];
    var dcaVal=units*last,lumpUnits=invested/p[0],lumpVal=lumpUnits*last;
    var avgCost=invested/units;
    var verdict=dcaVal>lumpVal?'Here monthly investing finished ahead of putting everything in at the start.':'Here investing everything at the start finished ahead, because prices only went up.';
    root.innerHTML='<div class="tabs" role="group" aria-label="Price path">'+Object.keys(SCEN).map(function(k){return '<button class="tab" data-k="'+k+'" aria-pressed="'+(k===cur)+'">'+SCEN[k].name+'</button>';}).join('')+'</div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Price (RM)</th><th>Units bought</th><th>Total units</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="stats">'+stat(fmt(invested),'Invested, RM600 a month',false)+stat('RM '+avgCost.toFixed(2),'Your average cost per unit',false)+stat(fmt(dcaVal),'Value of monthly plan at the end',true)+stat(fmt(lumpVal),'Value if all RM'+invested.toLocaleString('en-MY')+' went in at month 1',false)+'</div>'+
    '<p class="say">'+verdict+' Monthly investing helps most when prices swing. It lowers the stress of picking a start date, but it does not always win.</p>'+
    '<p class="fine">Made-up prices for teaching. Ignores fees.</p>';
    root.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){cur=b.dataset.k;draw();var t=root.querySelector('.tab[aria-pressed="true"]');if(t)t.focus();});});
  }
  draw();
};

function runQuiz(root,L,next){
  var i=0,score=0,q=L.quiz;
  function show(){
    if(i>=q.length){return finish();}
    var Q=q[i];
    root.innerHTML='<div class="q-head">Question '+(i+1)+' of '+q.length+'</div><h3 class="q-text">'+Q.q+'</h3><div class="opts">'+Q.o.map(function(o,n){return '<button class="opt" data-n="'+n+'">'+o+'</button>'}).join('')+'</div><div class="q-fb" aria-live="polite"></div>';
    root.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){
      var n=+b.dataset.n,right=n===Q.a;
      root.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(+x.dataset.n===Q.a)x.classList.add('ok');});
      if(!right)b.classList.add('no');else score++;
      var fb=root.querySelector('.q-fb');
      fb.innerHTML='<b>'+(right?'Correct. ':'Not quite. ')+'</b>'+Q.e+'<div class="row"><button class="btn" id="nx">'+(i===q.length-1?'See result':'Next question')+'</button></div>';
      var nx=$('#nx',root);nx.focus();nx.addEventListener('click',function(){i++;show();});
    });});
  }
  function finish(){
    var prev=store.done[L.id];
    store.done[L.id]=prev===undefined?score:Math.max(prev,score);save();updatePill();
    var msg=score===q.length?'Full marks. You have this one.':score>=2?'Good work. Reread the explanations on any you missed.':'Worth another read of the lesson, then try again.';
    root.innerHTML='<p class="q-head">Result</p><div class="score">'+score+' / '+q.length+'</div><p>'+msg+'</p><div class="row">'+
      (next?'<a class="btn" href="#lesson-'+next.id+'">Next: '+next.title+'</a>':'<a class="btn" href="#home">Back to all lessons</a>')+
      '<button class="btn ghost" id="again">Try the quiz again</button></div>';
    $('#again',root).addEventListener('click',function(){i=0;score=0;show();});
  }
  show();
}

function renderGlossary(){
  setNav('glossary');document.title='Modal';
  app.innerHTML='<h1>Glossary</h1><p class="lede">Plain-language meanings for the terms you will meet.</p>'+
  '<label for="q" class="eyebrow" style="margin-top:22px;margin-bottom:0;display:block">Search terms</label>'+
  '<input id="q" class="search" type="search" placeholder="Try “dividend” or “EPF”" autocomplete="off">'+
  '<dl class="gl" id="gl"></dl><p class="fine" id="none" hidden>No terms match that search.</p>';
  var dl=$('#gl');
  dl.innerHTML=GLOSSARY.map(function(g){return '<div data-t="'+(g[0]+' '+g[1]).toLowerCase().replace(/"/g,'')+'"><dt>'+g[0]+'</dt><dd>'+g[1]+'</dd></div>'}).join('');
  $('#q').addEventListener('input',function(e){
    var t=e.target.value.trim().toLowerCase(),shown=0;
    dl.querySelectorAll('div').forEach(function(d){var m=!t||d.dataset.t.indexOf(t)>-1;d.hidden=!m;if(m)shown++;});
    $('#none').hidden=shown>0;
  });
}

function route(){
  var h=location.hash.replace('#','');
  if(h.indexOf('lesson-')===0){
    for(var i=0;i<LESSONS.length;i++){if('lesson-'+LESSONS[i].id===h){renderLesson(LESSONS[i],i);window.scrollTo(0,0);return;}}
  }
  if(h==='glossary'){renderGlossary();window.scrollTo(0,0);return;}
  renderHome();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
updatePill();route();
})();
</script>

</body>
</html>
